<svg xmlns="http://www.w3.org/2000/svg" width="420" height="225" viewBox="0 0 420 225">
  <style>
    .t { font: 700 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #70A5FD; }
    .l { font: 500 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #A9B1D6; }
    .v { font: 700 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #38BDAE; }
    .row { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" rx="10" width="419" height="224" fill="#1A1B27" stroke="#2A2E45"/>
  <text x="25" y="38" class="t">GitHub Activity</text>
  <g class="row" style="animation-delay:0.00s"><text x="25" y="75" class="l">⚡  Contributions (last year)</text><text x="395" y="75" class="v" text-anchor="end">36</text></g>
  <g class="row" style="animation-delay:0.15s"><text x="25" y="105" class="l">📦  Commits (last year)</text><text x="395" y="105" class="v" text-anchor="end">18</text></g>
  <g class="row" style="animation-delay:0.30s"><text x="25" y="135" class="l">🔀  Pull requests</text><text x="395" y="135" class="v" text-anchor="end">1</text></g>
  <g class="row" style="animation-delay:0.45s"><text x="25" y="165" class="l">📁  Public repositories</text><text x="395" y="165" class="v" text-anchor="end">9</text></g>
  <g class="row" style="animation-delay:0.60s"><text x="25" y="195" class="l">⭐  Stars earned</text><text x="395" y="195" class="v" text-anchor="end">0</text></g>
</svg>
