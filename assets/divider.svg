<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f1b2d"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#13B9FD"/><stop offset="1" stop-color="#5FE3C0"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#0553B1"/><stop offset="0.5" stop-color="#13B9FD"/><stop offset="1" stop-color="#5FE3C0"/></linearGradient>
</defs>
<rect x="0" y="11" width="900" height="2" rx="1" fill="#30363d"/>
<rect x="0" y="10" width="220" height="4" rx="2" fill="url(#edge)">
<animate attributeName="x" values="-220;900" dur="5s" repeatCount="indefinite"/></rect>
<circle cx="450.0" cy="12" r="5" fill="#13B9FD"><animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
